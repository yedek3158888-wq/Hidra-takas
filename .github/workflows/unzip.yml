name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o hidra-takas-adim2.zip
          cp -r hidra-takas/. .
          rm -rf hidra-takas hidra-takas-adim2.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Adım 2 dosyaları"
          git push
